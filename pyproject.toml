[project]
name = "data-acquisition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rich Huang", email = "rhuang00@byu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
data-acquisition = "data_acquisition:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
